# nginx im web-Container: liefert ausschliesslich die gebaute React-SPA aus.
# /api und /uploads kommen hier nie an — Traefik routet sie mit hoeherer
# Prioritaet direkt an den api-Container (siehe infra/docker-compose.prod.yml).
# Dadurch entfaellt die Falle aus dem alten Setup, in der die
# Caching-Regex-Location Bild-URLs wie /api/uploads/vehicles/*.jpg als
# statische Frontend-Datei behandelt hat (NGINX_SETUP_DOCS.md).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fahrzeugbilder bis 5 MB (Limit in backend/src/routes/vehicles.js).
    # Der Upload laeuft ueber Traefik direkt an den api-Container, nicht durch
    # dieses nginx — das Limit steht hier nur, damit die heutige Konfiguration
    # vollstaendig uebernommen ist und ein spaeterer Umbau nicht in das
    # 413-Problem zurueckfaellt.
    client_max_body_size 8m;

    # Siehe die ausfuehrliche Begruendung in nginx-landing.conf: hinter Traefik
    # ist $scheme im Container http, ein absoluter Location-Header zeigte
    # deshalb auf http://. Die SPA erzeugt zwar im Normalfall keine
    # Verzeichnis-Redirects, aber das kostet nichts und kann spaeter nicht
    # zur Falle werden.
    absolute_redirect off;

    # SPA-Fallback fuer React Router: jede unbekannte URL liefert index.html,
    # damit /calendar oder /admin/tenants auch beim Direktaufruf funktionieren.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Vite-Assets sind unveraenderlich und duerfen lange cachen.
    #
    # max-age steht bewusst im add_header statt in einem zusaetzlichen
    # `expires 1y`: `expires` setzt selbst schon ein Cache-Control, zusammen
    # mit dem add_header kamen zwei Cache-Control-Zeilen in der Antwort an.
    # Clients fassen das korrekt zusammen, aber es liest sich wie ein Fehler
    # und im alten Setup war genau diese Doppelung drin.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # index.html darf *nicht* cachen: sie verweist auf die gehashten
    # Asset-Namen. Eine gecachte index.html nach einem Deploy zeigt auf
    # Dateien, die es nicht mehr gibt — die App bleibt dann weiss.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
