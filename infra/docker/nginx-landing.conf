# nginx im landing-Container: statische Astro-Seite (fabu-online.de).
#
# Wichtig: Die Landing-Page ist KEINE Single-Page-App. Ein pauschaler Fallback
# auf /index.html wuerde /impressum und /datenschutz auf die Startseite
# leiten — genau der Fehler, der im alten Setup zweimal auftrat und in
# NGINX_SETUP_DOCS.md mit einem sed-Einzeiler repariert werden musste. Astro
# legt die Seiten als impressum.html bzw. impressum/index.html ab, deshalb
# `$uri.html` und am Ende ein ehrliches 404.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro baut mit `format: 'directory'`, legt die Seiten also als
    # impressum/index.html ab. Ein Aufruf von /impressum trifft damit die
    # $uri/-Regel unten, und nginx antwortet mit 301 auf /impressum/.
    #
    # Dieses `absolute_redirect off` ist der Grund, warum das hinter Traefik
    # richtig funktioniert: ohne es baut nginx den Location-Header absolut aus
    # $scheme://$host — und $scheme ist im Container *http*, weil Traefik das
    # TLS schon terminiert hat. Der Browser bekaeme
    # "Location: http://fabu-online.de/impressum/", liefe in Traefiks
    # http->https-Umleitung und waere einen unnoetigen Klartext-Umweg
    # spaeter am Ziel. Im alten Setup fiel das nicht auf, weil nginx dort
    # selbst TLS terminierte und $scheme bereits https war.
    #
    # Mit `off` wird der Header relativ ("Location: /impressum/"), also
    # unabhaengig von Schema, Host und Port. Verifiziert am 24.10.2026 im
    # lokalen Probelauf (infra/docker-compose.local-test.yml).
    absolute_redirect off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Ein Cache-Control-Header, nicht zwei — siehe nginx-web.conf.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
